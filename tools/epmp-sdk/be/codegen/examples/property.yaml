version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

domain:
  name: Property
  package: property
  table: properties
  bounded_context: property

  fields:
    - name: id
      type: uuid
      primary_key: true
      auto: true

    - name: name
      type: string
      max_length: 255
      searchable: true

    - name: description
      type: text
      nullable: true

    - name: address
      type: text
      nullable: true

    - name: property_type
      type: enum
      enum_values:
        - boarding_house
        - apartment
        - villa
        - warehouse

    - name: is_active
      type: bool
      default: true

  behaviors:
    soft_delete: true
    audit_trail: true
    pagination: true
    search: true
    filter_by:
      - property_type
      - is_active
    sort_by:
      - name
      - created_at

  rest:
    base_path: /api/properties
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - PropertyCreated
    - PropertyUpdated
    - PropertyDeleted
