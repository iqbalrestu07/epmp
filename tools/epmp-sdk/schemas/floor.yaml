version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: Floor
  package: floor
  table: floors
  bounded_context: property

  fields:
    - name: id
      type: uuid
      primary_key: true
      auto: true

    - name: organization_id
      type: uuid
      searchable: true

    - name: building_id
      type: uuid
      searchable: true

    - name: name
      type: string
      max_length: 100
      searchable: true

    - name: floor_number
      type: int
      searchable: true

    - name: is_active
      type: bool
      default: true

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    sort_by:
      - floor_number
      - name

  rest:
    base_path: /api/floors
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list
