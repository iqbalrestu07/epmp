version: "1.0"
dry_run: false

# Shared configuration for both backend and frontend SDKs
backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: Room
  package: room
  table: rooms
  bounded_context: property

  fields:
    - name: id
      type: uuid
      primary_key: true
      auto: true

    - name: name
      type: string
      max_length: 100
      searchable: true

    - name: floor
      type: int

    - name: capacity
      type: int
      default: 1

    - name: price
      type: decimal

    - name: is_available
      type: bool
      default: true

    - name: property_id
      type: uuid
      foreign_key:
        domain: Property
        field: id

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    filter_by:
      - is_available
      - property_id
    sort_by:
      - name
      - floor
      - price

  rest:
    base_path: /api/rooms
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - RoomCreated
    - RoomUpdated
    - RoomAvailabilityChanged
