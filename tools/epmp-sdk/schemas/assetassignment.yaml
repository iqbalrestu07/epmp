version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: AssetAssignment
  package: assetassignment
  table: asset_assignments
  bounded_context: asset

  fields:
    - name: organization_id
      type: uuid
      searchable: true
    - name: id
      type: uuid
      primary_key: true
      auto: true
    - name: asset_id
      type: uuid
      searchable: true
    - name: room_id
      type: uuid
      searchable: true
    - name: assigned_date
      type: timestamp

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    sort_by:
      - created_at

  rest:
    base_path: /api/asset_assignments
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - AssetAssignmentCreated
