version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: Penalty
  package: penalty
  table: penalties
  bounded_context: billing

  fields:
    - name: organization_id
      type: uuid
      searchable: true
    - name: id
      type: uuid
      primary_key: true
      auto: true

    - name: invoice_id
      type: uuid
      searchable: true

    - name: amount
      type: decimal
      default: 0

    - name: status
      type: enum
      enum_values:
        - Unpaid
        - Paid
        - Waived
      default: "Unpaid"

    - name: penalty_date
      type: timestamp

    - name: description
      type: text

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    filter_by:
      - status
      - invoice_id
    sort_by:
      - penalty_date
      - created_at

  rest:
    base_path: /api/penalties
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - PenaltyApplied
    - PenaltyPaid
    - PenaltyWaived
