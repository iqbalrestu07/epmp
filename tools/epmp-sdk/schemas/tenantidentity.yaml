version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: TenantIdentity
  package: tenantidentity
  table: tenant_identities
  bounded_context: tenant

  fields:
    - name: organization_id
      type: uuid
      searchable: true
    - name: id
      type: uuid
      primary_key: true
      auto: true
    - name: tenant_id
      type: uuid
      searchable: true
    - name: identity_type
      type: enum
      enum_values:
        - KTP
        - Passport
      default: "KTP"
    - name: identity_number
      type: string
      max_length: 100
      searchable: true
    - name: file_url
      type: string
      nullable: true

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    sort_by:
      - created_at

  rest:
    base_path: /api/tenant_identities
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - TenantIdentityCreated
