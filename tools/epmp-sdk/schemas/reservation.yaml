version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: Reservation
  package: reservation
  table: reservations
  bounded_context: reservation

  fields:
    - name: id
      type: uuid
      primary_key: true
      auto: true

    - name: tenant_id
      type: uuid
      searchable: true

    - name: property_id
      type: uuid
      searchable: true

    - name: room_id
      type: uuid
      searchable: true

    - name: status
      type: enum
      enum_values:
        - Draft
        - Pending
        - Confirmed
        - Cancelled
        - Expired
      default: "Draft"

    - name: check_in_date
      type: timestamp

    - name: check_out_date
      type: timestamp
      nullable: true

    - name: booking_fee
      type: decimal
      default: 0

    - name: notes
      type: text
      nullable: true

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    filter_by:
      - status
      - property_id
    sort_by:
      - check_in_date
      - created_at

  rest:
    base_path: /api/reservations
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - ReservationCreated
    - ReservationConfirmed
    - ReservationCancelled
    - ReservationExpired
