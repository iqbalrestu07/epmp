version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: Supplier
  package: supplier
  table: vendors
  bounded_context: maintenance

  fields:
    - name: organization_id
      type: uuid
      searchable: true
    - name: id
      type: uuid
      primary_key: true
      auto: true
    - name: name
      type: string
      max_length: 100
      searchable: true
    - name: contact_person
      type: string
      max_length: 100
    - name: phone
      type: string
      max_length: 50
    - name: service_type
      type: string
      max_length: 100

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    sort_by:
      - created_at

  rest:
    base_path: /api/vendors
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - VendorCreated
