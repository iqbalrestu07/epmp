version: "1.0"
dry_run: false

backend:
  output_root: "./internal"
  module_path: "github.com/epmp/backend"
  artifacts:
    - dto
    - repository
    - rest
    - test

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: RoomType
  package: roomtype
  table: room_types
  bounded_context: property

  fields:
    - name: organization_id
      type: uuid
      searchable: true
    - name: id
      type: uuid
      primary_key: true
      auto: true
    - name: name
      type: string
      max_length: 100
      searchable: true
    - name: description
      type: text
      nullable: true
    - name: base_price
      type: decimal
      default: 0

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    sort_by:
      - created_at

  rest:
    base_path: /api/room_types
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list

  events:
    - RoomTypeCreated
