version: "1.0"
dry_run: false

frontend:
  output_root: "./src"
  base_url: "/api"

domain:
  name: Tenant
  package: tenant
  table: tenants
  bounded_context: tenant

  fields:
    - name: id
      type: uuid
      primary_key: true
      auto: true

    - name: full_name
      type: string
      max_length: 255
      searchable: true

    - name: email
      type: string
      max_length: 255
      unique: true

    - name: phone
      type: string
      max_length: 50
      nullable: true

    - name: is_active
      type: bool
      default: true

  behaviors:
    soft_delete: true
    pagination: true
    search: true
    filter_by:
      - is_active
    sort_by:
      - full_name

  rest:
    base_path: /api/tenants
    auth_required: true
    operations:
      - create
      - read
      - update
      - delete
      - list
